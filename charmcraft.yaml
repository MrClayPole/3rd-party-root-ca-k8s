type: charm
name: third-party-root-ca
title: Third-party root CA
summary: Provide a configured root CA over certificate_transfer.
description: |
  A Kubernetes Juju charm that provides one configured PEM root CA through the
  standard certificate_transfer interface.

  Integrate its send-ca-cert endpoint with a consumer's receive-ca-cert
  endpoint. Consumers are responsible for placing the received CA in their own
  workload trust store.
platforms:
  ubuntu@22.04:amd64:
  ubuntu@22.04:arm64:
  ubuntu@24.04:amd64:
  ubuntu@24.04:arm64:
assumes:
  - juju >= 3.6
parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
provides:
  send-ca-cert:
    interface: certificate_transfer
    description: Provides the configured third-party root CA to consumers.
config:
  options:
    root-ca:
      type: string
      default: ""
      description: |
        Exactly one PEM-encoded third-party root CA certificate. It is
        published to all send-ca-cert relations after validation.
