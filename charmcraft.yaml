type: charm
name: third-party-root-ca
title: Third-party root CA
summary: Add a configured root CA to Ubuntu system trust stores.
description: |
  A subordinate charm that installs one PEM-encoded third-party root CA in the
  Ubuntu system trust store of its associated machine or LXD system container.

  The charm writes /usr/local/share/ca-certificates/third-party-root-ca.crt and
  runs update-ca-certificates whenever the root-ca configuration changes.

  Kubernetes workload containers are isolated from subordinate charm containers.
  A principal Kubernetes charm must explicitly expose a shared writable volume
  for any cross-container trust-store update; this charm does not bypass that
  isolation boundary.
base: ubuntu@24.04
platforms:
  amd64:
  arm64:
assumes:
  - juju >= 3.6
subordinate: true
requires:
  juju-info:
    interface: juju-info
    scope: container
parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
config:
  options:
    root-ca:
      type: string
      default: ""
      description: |
        PEM-encoded third-party root CA certificate. Set this to install or
        replace the managed certificate; set it to an empty string to remove it.
